<?xml version="1.0" encoding="UTF-8"?>
<!--
  OpenTRAP application icon: bidirectional traffic arrows.

  Based on the "knemo-monitor" icon from the Flat Remix icon theme by
  Daniel Ruiz de Alegria (https://github.com/daniruiz/flat-remix), licensed
  GNU GPL v3. Two changes from the original: the fill is pinned to the theme's
  orange so the icon stays visible on any desktop colour scheme, and the viewBox is
  cropped to the artwork so it fills an application tile rather than carrying the
  heavy padding a system-tray icon needs. See CREDITS.md.
-->
